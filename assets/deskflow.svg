<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="210" viewBox="0 0 1000 210" role="img" aria-label="Projeto DeskFlow" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="shine" x1="0" x2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.55"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <clipPath id="card"><rect width="1000" height="210" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#card)">
    <rect width="1000" height="210" fill="#E0218A"/>
    <rect x="-300" y="0" width="300" height="210" fill="url(#shine)" transform="skewX(-20)"><animate attributeName="x" values="-300;1300" dur="4s" repeatCount="indefinite"/></rect>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="40" y="62" font-size="34" font-weight="800" fill="#FFFFFF">DeskFlow</text>
    <text x="40" y="92" font-size="18" font-weight="600" fill="#FFE4F2">Central de Serviços de TI · Projeto Integrador de Gerência de Configuração</text>
    <text x="40" y="122" font-size="15" fill="#FFF0F7">API em Node.js com PostgreSQL, segurança com JWT, testes e CI no GitHub Actions,</text>
    <text x="40" y="142" font-size="15" fill="#FFF0F7">com baselines, controle de mudanças e rastreabilidade de requisitos.</text>
    <g font-size="13" font-weight="700">
      <rect x="40" y="160" width="86" height="28" rx="14" fill="#FFFFFF"/><text x="83" y="179" text-anchor="middle" fill="#E0218A">Node.js</text>
      <rect x="136" y="160" width="106" height="28" rx="14" fill="#FFFFFF"/><text x="189" y="179" text-anchor="middle" fill="#E0218A">TypeScript</text>
      <rect x="252" y="160" width="112" height="28" rx="14" fill="#FFFFFF"/><text x="308" y="179" text-anchor="middle" fill="#E0218A">PostgreSQL</text>
      <rect x="374" y="160" width="60" height="28" rx="14" fill="#FFFFFF"/><text x="404" y="179" text-anchor="middle" fill="#E0218A">JWT</text>
      <rect x="444" y="160" width="138" height="28" rx="14" fill="#FFFFFF"/><text x="513" y="179" text-anchor="middle" fill="#E0218A">GitHub Actions</text>
    </g>
    <g transform="translate(880 105)">
      <circle r="44" fill="none" stroke="#FFC0E3" stroke-width="6"/>
      <circle r="44" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-dasharray="70 207" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="3s" repeatCount="indefinite"/></circle>
      <text y="7" text-anchor="middle" font-size="18" font-weight="800" fill="#FFFFFF">CI ✓</text>
    </g>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
