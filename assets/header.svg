    <animate attributeName="d" dur="6s" repeatCount="indefinite" values="M0 210 C 200 170, 350 250, 520 215 S 820 180, 1000 215 L1000 260 L0 260 Z;M0 220 C 180 250, 380 180, 540 210 S 840 250, 1000 205 L1000 260 L0 260 Z;M0 210 C 200 170, 350 250, 520 215 S 820 180, 1000 215 L1000 260 L0 260 Z"/>
  </path>
  <g fill="#FFFFFF">
