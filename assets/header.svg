    <clipPath id="typing"><rect x="0" y="70" height="80" width="0"><animate attributeName="width" values="0;1000;1000;0" keyTimes="0;0.45;0.9;1" dur="7s" repeatCount="indefinite"/></rect></clipPath>
    <path id="spark" d="M0 -10 L2.5 -2.5 L10 0 L2.5 2.5 L0 10 L-2.5 2.5 L-10 0 L-2.5 -2.5 Z"/>
